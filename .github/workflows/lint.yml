name: "Lint"

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "master"

permissions:
  contents: read

jobs:
  ruff:
    name: "HA ${{ matrix.homeassistant }} / Python ${{ matrix.python }}"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        include:
          - homeassistant: "2026.10.2"
            python: "3.14.6"
          - homeassistant: "2026.10.3"
            python: "3.14.9"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v4.1.0"

        - name: "Set up Python"
          uses: actions/setup-python@v4.7.1
          with:
            python-version: "${{ matrix.python }}"
            cache: "pip"

        - name: "Install requirements"
          shell: bash
          run: |
            python3 -m pip install -r requirements.txt
            python3 -m pip install "homeassistant==${{ matrix.homeassistant }}"
            python3 -c 'import json; from pathlib import Path; print("\n".join(json.loads(Path("custom_components/proflame_connect_wifi/manifest.json").read_text())["requirements"]))' | python3 -m pip install -r /dev/stdin

        - name: "Run"
          run: python3 -m ruff check .

        - name: "Offline tests"
          run: python3 -m pytest -q