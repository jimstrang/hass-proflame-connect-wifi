---
name: "Bug report"
description: "Report a bug with the integration"
labels: "Bug"
body:
- type: markdown
  attributes:
    value: Search existing issues first. Redact IP addresses, hostnames, MAC addresses, credentials, and unrelated installation details. Do not perform unattended fireplace control tests to reproduce a bug.
- type: textarea
  attributes:
    label: "Versions and device details"
    description: "Include Home Assistant, integration, and Python versions; fireplace/dongle model and firmware if known. Do not include network addresses or unique hardware identifiers."
  validations:
    required: true
- type: checkboxes
  attributes:
    label: Checklist
    options:
      - label: I have enabled debug logging for my installation.
        required: true
      - label: I have filled out the issue template to the best of my ability.
        required: true
      - label: This issue only contains 1 issue (if you have multiple issues, open one issue for each issue).
        required: true
      - label: This issue is not a duplicate of an [existing issue](https://github.com/jimstrang/hass-proflame-connect-wifi/issues).
        required: true
- type: textarea
  attributes:
    label: "Describe the issue"
    description: "A clear and concise description of what the issue is."
  validations:
    required: true
- type: textarea
  attributes:
    label: Reproduction steps
    description: "Describe safe reproduction steps and distinguish observed hardware behavior from reported settings. Explicitly state whether any control commands were sent."
    value: |
      1.
      2.
      3.
      ...
  validations:
    required: true
- type: textarea
  attributes:
    label: "Debug logs"
    description: "Enable integration debug logging, capture the relevant failure, then disable logging. Redact network addresses, hostnames, MAC addresses, credentials, and unrelated information before posting."
    render: text
  validations:
    required: true